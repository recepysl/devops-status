name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Self-check
        run: swift run DevOpsStatus --selftest

      - name: Unit tests
        run: swift test

      - name: Assemble app bundle
        run: ./scripts/build.sh

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: DevOpsStatus.app
          path: DevOpsStatus.app
          retention-days: 7
